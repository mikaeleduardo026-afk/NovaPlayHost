name: Publish NovaPlayHost sites

on:
  push:
    branches: [main]
    paths:
      - "site.rar"
      - "legal.html"
      - "index.html"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: novaplayhost-static-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install RAR extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y unar

      - name: Extract and prepare every site
        run: python3 scripts/prepare_pages.py

      - name: Publish static website to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
          commit_message: "Publish NovaPlayHost sites: ${{ github.sha }}"
